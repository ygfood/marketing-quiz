<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マーケティング検定2級 演習</title>
<style>
  :root{
    --header: #2F4F3E;
    --header-dark: #24402F;
    --bg: #F7F4EC;
    --card: #FFFFFF;
    --ink: #23291F;
    --sub: #6B7568;
    --line: #E4DFD1;
    --orange: #D97B3F;
    --orange-dark: #BE6530;
    --correct: #3F7D5C;
    --correct-bg: #E9F3EC;
    --wrong: #C0553A;
    --wrong-bg: #FBEAE4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    background:linear-gradient(180deg, var(--header) 0%, var(--header-dark) 100%);
    color:#fff;
    padding:18px 20px 16px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .header-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .header-score{
    font-size:13px;
    background:rgba(255,255,255,0.15);
    padding:4px 10px;
    border-radius:12px;
  }
  .progress-track{
    height:6px;
    background:rgba(255,255,255,0.2);
    border-radius:3px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--orange);
    border-radius:3px;
    transition:width 0.3s ease;
  }
  main{
    flex:1;
    padding:18px 16px 32px;
  }
  .area-tag{
    display:inline-block;
    font-size:12px;
    color:var(--header);
    background:#E4EBE4;
    padding:4px 10px;
    border-radius:6px;
    margin-bottom:12px;
    font-weight:600;
  }
  .case-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
    line-height:1.85;
    font-size:14.5px;
  }
  .case-card p{margin:0 0 10px;}
  .case-card p:last-child{margin-bottom:0;}
  .question-text{
    font-size:15.5px;
    font-weight:700;
    margin:0 0 16px;
    line-height:1.7;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:18px;
  }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
    line-height:1.55;
  }
  .option:active{transform:scale(0.99);}
  .option .num{
    flex:0 0 30px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:var(--orange);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:14px;
  }
  .option.disabled{cursor:default;}
  .option.correct{
    border-color:var(--correct);
    background:var(--correct-bg);
  }
  .option.correct .num{background:var(--correct);}
  .option.wrong{
    border-color:var(--wrong);
    background:var(--wrong-bg);
  }
  .option.wrong .num{background:var(--wrong);}
  .option.faded{opacity:0.55;}

  .result-banner{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:15px;
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:14px;
  }
  .result-banner.ok{background:var(--correct-bg); color:var(--correct);}
  .result-banner.ng{background:var(--wrong-bg); color:var(--wrong);}

  .explain{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    font-size:13.8px;
    line-height:1.8;
  }
  .explain h4{
    margin:0 0 8px;
    font-size:13px;
    color:var(--header);
    font-weight:700;
  }
  .explain .block{margin-bottom:14px;}
  .explain .block:last-child{margin-bottom:0;}
  .explain .label{
    display:inline-block;
    font-size:11.5px;
    font-weight:700;
    padding:2px 7px;
    border-radius:5px;
    margin-right:6px;
  }
  .explain .label.c{background:var(--correct-bg); color:var(--correct);}
  .explain .label.w{background:var(--wrong-bg); color:var(--wrong);}
  .explain .point{
    margin-top:14px;
    padding-top:12px;
    border-top:1px dashed var(--line);
    color:var(--sub);
    font-size:13px;
  }

  .next-btn{
    display:block;
    width:100%;
    margin-top:18px;
    padding:14px;
    background:var(--orange);
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .next-btn:active{background:var(--orange-dark);}

  .finish-screen{
    text-align:center;
    padding:40px 20px;
  }
  .finish-score{
    font-size:44px;
    font-weight:800;
    color:var(--header);
    margin:10px 0;
  }
  .restart-btn{
    margin-top:20px;
    padding:12px 24px;
    background:var(--header);
    color:#fff;
    border:none;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }

  .review-list{
    text-align:left;
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .review-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    font-size:13.5px;
  }
  .review-item .badge{
    font-weight:700;
    font-size:12px;
    padding:3px 8px;
    border-radius:6px;
  }
  .review-item .badge.ok{background:var(--correct-bg); color:var(--correct);}
  .review-item .badge.ng{background:var(--wrong-bg); color:var(--wrong);}

  .stats-btn{
    background:rgba(255,255,255,0.15);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:6px 12px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .stats-overall{
    text-align:center;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px;
    margin-bottom:20px;
  }
  .section-title{
    font-size:13.5px;
    font-weight:700;
    color:var(--header);
    margin:0 0 8px 2px;
  }
  .stats-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:22px;
  }
  .area-stat-row{
    margin-bottom:14px;
  }
  .area-stat-row:last-child{margin-bottom:0;}
  .area-stat-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:5px;
  }
  .area-stat-name{
    font-size:13.5px;
    font-weight:600;
  }
  .area-stat-pct{
    font-size:12.5px;
    font-weight:700;
  }
  .progress-track.light{
    background:var(--line);
    height:7px;
  }
  .wrong-card{max-height:420px; overflow-y:auto;}
  .wrong-item{
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .wrong-item:last-child{border-bottom:none;}
  .area-tag.small{
    font-size:11px;
    padding:2px 8px;
    margin-bottom:6px;
  }
  .wrong-q{
    font-size:13px;
    line-height:1.6;
    color:var(--ink);
  }
  .backup-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .conn-warning{
    background:var(--wrong-bg);
    color:var(--wrong);
    border-radius:10px;
    padding:10px 14px;
    font-size:12.5px;
    line-height:1.6;
    margin-bottom:14px;
  }
  .backup-btn{
    flex:1;
    text-align:center;
    display:block;
    background:var(--header);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:12px 8px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>

{
  area:"グローバル・マーケティング",
  case:"同じ品質の腕時計であっても、消費者は「スイス製」と表示された製品に対して、他国製の同等品よりも高い品質・信頼性を感じ、高い価格でも購入する傾向がある。",
  question:"このように、製品の原産国のイメージが消費者の製品評価に影響を与える現象を何と呼ぶか？",

  answer:0,
  points:[
    {i:0, correct:true, text:"カントリー・オブ・オリジン効果（原産国効果）は、製品の生産国・原産国に対するイメージが、消費者のその製品への品質評価・購買意欲に影響を与える現象。「スイス製の時計は高品質」等のイメージがその典型。"},
    {i:1, correct:false, text:"ブランド・エクイティは個別ブランドが持つ無形資産価値の概念であり、国という、より広いレベルのイメージ効果を指す本事例とは焦点が異なる。"},
    {i:2, correct:false, text:"知覚価値は便益とコストの比較評価の概念であり、原産国イメージという特定の情報源による評価への影響を直接説明する用語ではない。"},
    {i:3, correct:false, text:"コモディティ化は差別化が失われる現象で、本事例の「原産国により差別化されている」状況とは逆。"}
  ],
  point:"グローバル・マーケティングでは、原産国イメージ（Made in ●●効果）が製品評価・価格プレミアムに影響することがあり、これを活かしたブランディングも行われる。"

let current = 0;
let selected = null;
let score = 0;
let answered = [];
let view = 'quiz'; // 'quiz' | 'stats'
let history = [];       // 全セッション累積の解答履歴（永続化対象）
let storageOK = true;   // Supabase接続に失敗した場合はローカル変数のみで動作させる
let loading = true;     // 初回読み込み中フラグ

async function loadHistory(){
  loading = true;
  try{
    const { data, error } = await supabaseClient
      .from('quiz_history')
      .select('*')
      .order('ts', { ascending: true });
    if(error) throw error;
    history = (data || []).map(d => ({
      area: d.area,
      question: d.question,
      correct: d.correct,
      ts: new Date(d.ts).getTime()
    }));
    storageOK = true;
  }catch(e){
    console.error('Supabaseからの読み込みに失敗しました:', e);
    history = [];
    storageOK = false;
  }
  loading = false;
  render();
}

async function insertRecordRemote(record){
  if(!storageOK) return;
  try{
    const { error } = await supabaseClient
      .from('quiz_history')
      .insert([{ area: record.area, question: record.question, correct: record.correct }]);
    if(error) throw error;
  }catch(e){
    console.error('Supabaseへの保存に失敗しました:', e);
    storageOK = false;
    render(); // 保存失敗の警告を表示するため再描画
  }
}

function recordAnswer(q, correct){
  const record = {
    area: q.area,
    question: q.question,
    correct: correct,
    ts: Date.now()
  };
  history.push(record);
  insertRecordRemote(record);
}

function computeAreaStats(){
  const map = {};
  history.forEach(h => {
    if(!map[h.area]) map[h.area] = {total:0, correct:0};
    map[h.area].total++;
    if(h.correct) map[h.area].correct++;
  });
  return Object.keys(map).map(area => ({
    area,
    total: map[area].total,
    correct: map[area].correct,
    pct: Math.round((map[area].correct / map[area].total) * 100)
  })).sort((a,b) => a.pct - b.pct); // 正答率が低い順（弱点が上に来る）
}

function showStats(){
  view = 'stats';
  render();
}

function backToQuiz(){
  view = 'quiz';
  render();
}

async function clearHistory(){
  if(!confirm('保存されている全ての解答履歴（章別正答率・間違えた問題の記録）を削除します。よろしいですか？')) return;
  try{
    const { error } = await supabaseClient.from('quiz_history').delete().gte('id', 0);
    if(error) throw error;
  }catch(e){
    console.error('Supabaseでの削除に失敗しました:', e);
    alert('削除に失敗しました。通信状況を確認してもう一度お試しください。');
    return;
  }
  history = [];
  render();
}

function render(){
  const app = document.getElementById('app');
  if(loading){
    app.innerHTML = `
      <header><div class="header-top"><div class="header-title">マーケティング検定2級 演習</div></div></header>
      <main><div style="text-align:center;padding:60px 20px;color:var(--sub);font-size:14px;">読み込み中...</div></main>
    `;
    return;
  }
  if(view === 'stats'){
    renderStats(app);
    return;
  }
  if(current >= QUESTIONS.length){
    renderFinish(app);
    return;
  }
  const q = QUESTIONS[current];
  const progressPct = Math.round((current/QUESTIONS.length)*100);

  let optionsHtml = '';
  q.options.forEach((opt, i) => {
    let cls = 'option';
    if(selected !== null){
      cls += ' disabled';
      if(i === q.answer) cls += ' correct';
      else if(i === selected) cls += ' wrong';
      else cls += ' faded';
    }
    optionsHtml += `<button class="${cls}" onclick="selectOption(${i})" ${selected!==null?'disabled':''}>
      <span class="num">${i+1}</span><span>${opt}</span>
    </button>`;
  });

  let resultHtml = '';
  let explainHtml = '';
  if(selected !== null){
    const isCorrect = selected === q.answer;
    resultHtml = `<div class="result-banner ${isCorrect?'ok':'ng'}">${isCorrect? '正解です' : '不正解 — 正解は '+(q.answer+1)+'番'}</div>`;

    let blocks = '';
    q.points.forEach(p => {
      blocks += `<div class="block">
        <span class="label ${p.correct?'c':'w'}">${p.i+1}. ${p.correct?'正解':'誤り'}</span>
        ${p.text}
      </div>`;
    });
    explainHtml = `<div class="explain">
      <h4>解説</h4>
      ${blocks}
      <div class="point">📌 ${q.point}</div>
    </div>
    <button class="next-btn" onclick="nextQuestion()">${current+1 < QUESTIONS.length ? '次の問題へ' : '結果を見る'}</button>`;
  }

  app.innerHTML = `
    <header>
      <div class="header-top">
        <div class="header-title">マーケティング検定2級 演習</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="header-score">${current+1} / ${QUESTIONS.length}　正解 ${score}</div>
          <button class="stats-btn" onclick="showStats()">📊 統計</button>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </header>
    <main>
      ${!storageOK ? `<div class="conn-warning">⚠️ データベースに接続できていません。この状態での解答は記録が保存されません（演習自体は続けられます）。通信環境を確認して再読み込みしてください。</div>` : ''}
      <div class="area-tag">${q.area}</div>
      <div class="case-card">
        ${q.case.split('。').filter(s=>s.trim()).map(s=>`<p>${s.trim()}。</p>`).join('')}
      </div>
      <div class="question-text">${q.question}</div>
      <div class="options">${optionsHtml}</div>
      ${resultHtml}
      ${explainHtml}
    </main>
  `;
}

function selectOption(i){
  if(selected !== null) return;
  const q = QUESTIONS[current];
  selected = i;
  const correct = i === q.answer;
  if(correct) score++;
  answered.push({area:q.area, correct});
  recordAnswer(q, correct);
  render();
}

function nextQuestion(){
  current++;
  selected = null;
  render();
}

function renderFinish(app){
  const pct = Math.round((score/QUESTIONS.length)*100);
  const pass = pct >= 70;
  let reviewHtml = answered.map((a,idx) => `
    <div class="review-item">
      <span>第${idx+1}問（${a.area}）</span>
      <span class="badge ${a.correct?'ok':'ng'}">${a.correct?'正解':'不正解'}</span>
    </div>
  `).join('');

  app.innerHTML = `
    <header>
      <div class="header-top">
        <div class="header-title">結果</div>
        <button class="stats-btn" onclick="showStats()">📊 統計を見る</button>
      </div>
    </header>
    <main>
      <div class="finish-screen">
        <div style="font-size:14px;color:var(--sub);">正答率</div>
        <div class="finish-score">${pct}%</div>
        <div style="font-size:14px;color:${pass?'var(--correct)':'var(--wrong)'};font-weight:700;">
          ${score} / ${QUESTIONS.length} 問正解　${pass?'（合格ライン70%達成）':'（合格ライン70%未達）'}
        </div>
        <div class="review-list">${reviewHtml}</div>
        <button class="restart-btn" onclick="restart()">もう一度解く</button>
      </div>
    </main>
  `;
}

function renderStats(app){
  const areaStats = computeAreaStats();
  const totalAnswered = history.length;
  const totalCorrect = history.filter(h=>h.correct).length;
  const overallPct = totalAnswered ? Math.round((totalCorrect/totalAnswered)*100) : 0;

  let areaHtml = areaStats.length ? areaStats.map(a => `
    <div class="area-stat-row">
      <div class="area-stat-top">
        <span class="area-stat-name">${a.area}</span>
        <span class="area-stat-pct" style="color:${a.pct>=70?'var(--correct)':'var(--wrong)'}">${a.pct}%（${a.correct}/${a.total}問）</span>
      </div>
      <div class="progress-track light">
        <div class="progress-fill" style="width:${a.pct}%; background:${a.pct>=70?'var(--correct)':'var(--wrong)'}"></div>
      </div>
    </div>
  `).join('') : `<div style="color:var(--sub);font-size:13.5px;padding:10px 0;">まだ解答履歴がありません。演習を進めると章ごとの正答率がここに表示されます。</div>`;

  const wrongList = history.filter(h => !h.correct).slice().reverse();
  let wrongHtml = wrongList.length ? wrongList.slice(0,50).map(w => `
    <div class="wrong-item">
      <span class="area-tag small">${w.area}</span>
      <div class="wrong-q">${w.question}</div>
    </div>
  `).join('') : `<div style="color:var(--sub);font-size:13.5px;padding:10px 0;">間違えた問題はまだありません。</div>`;

  app.innerHTML = `
    <header>
      <div class="header-top">
        <div class="header-title">学習統計</div>
        <button class="stats-btn" onclick="backToQuiz()">← 演習に戻る</button>
      </div>
    </header>
    <main>
      <div class="stats-overall">
        <div style="font-size:13px;color:var(--sub);">累積解答数 ${totalAnswered}問中の正答率</div>
        <div class="finish-score" style="font-size:36px;margin:4px 0;">${overallPct}%</div>
      </div>

      <div class="section-title">章別の正答率（弱点が上に表示されます）</div>
      <div class="stats-card">${areaHtml}</div>

      <div class="section-title">間違えた問題一覧（新しい順・最大50件）</div>
      <div class="stats-card wrong-card">${wrongHtml}</div>

      <div class="backup-row">
        <button class="backup-btn" onclick="exportHistory()">⬇ バックアップをダウンロード</button>
        <label class="backup-btn" for="import-file">⬆ バックアップから復元</label>
        <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importHistory(event)">
      </div>
      <div style="font-size:12px;color:var(--sub);text-align:center;margin:6px 0 4px;">
        ブラウザやデバイスを変えても記録を失わないよう、時々バックアップの保存をおすすめします
      </div>

      <button class="restart-btn" style="background:var(--wrong);margin-top:14px;" onclick="clearHistory()">履歴を全て削除する</button>
    </main>
  `;
}

function exportHistory(){
  const dataStr = JSON.stringify(history, null, 2);
  const blob = new Blob([dataStr], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const dateStr = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `marketing_quiz_history_${dateStr}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importHistory(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    try{
      const imported = JSON.parse(e.target.result);
      if(!Array.isArray(imported)) throw new Error('invalid format');
      const merge = confirm(
        `${imported.length}件の履歴が見つかりました。\n\n「OK」＝データベースに追加でマージする\n「キャンセル」＝復元をやめる`
      );
      if(!merge) return;
      const rows = imported.map(r => ({
        area: r.area,
        question: r.question,
        correct: r.correct
      }));
      const { error } = await supabaseClient.from('quiz_history').insert(rows);
      if(error) throw error;
      await loadHistory();
      alert('復元が完了しました。');
    }catch(err){
      console.error(err);
      alert('ファイルの読み込み、またはデータベースへの復元に失敗しました。正しいバックアップファイルか、通信状況を確認してください。');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function restart(){
  current = 0;
  selected = null;
  score = 0;
  answered = [];
  view = 'quiz';
  render();
}

loadHistory();
</script>
